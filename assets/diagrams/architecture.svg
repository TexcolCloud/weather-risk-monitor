<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1260" viewBox="0 0 1640 1260" role="img" aria-labelledby="title desc">
<title id="title">天气风险监控 · 组件与依赖架构</title><desc id="desc">范围：当前实际运行组件与直接依赖；矩形标注职责，箭头标注调用方向与协议；全部连接线为水平或垂直线段。可放大阅读。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#516477"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect x="0" y="0" width="1640" height="1260" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/>
<text x="40" y="58" font-size="34" fill="#16324a" text-anchor="start" font-weight="700">天气风险监控 · 组件与依赖架构</text>
<text x="40" y="94" font-size="19" fill="#516477" text-anchor="start">范围：当前实际运行组件与直接依赖；矩形标注职责，箭头标注调用方向与协议</text>
<text x="40" y="132" font-size="18" fill="#516477" text-anchor="start">图例：实线＝调用 / 写入方向   虚线边框＝运行边界   下栏＝存储与依赖说明</text>
<rect x="40" y="180" width="1020" height="750" fill="#fafcfe" stroke="#aabac9" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="60" y="216" font-size="24" fill="#16324a" text-anchor="start" font-weight="700">本地应用</text>
<rect x="1120" y="180" width="480" height="750" fill="#fafcfe" stroke="#aabac9" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1140" y="216" font-size="24" fill="#16324a" text-anchor="start" font-weight="700">外部服务</text>
<rect x="70" y="275" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="70" y="275" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="88" y="307" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">CLI / APScheduler</text>
<text x="88" y="338" font-size="19" fill="#516477" text-anchor="start">命令解析、定时触发与启动补跑</text>
<text x="88" y="364" font-size="19" fill="#516477" text-anchor="start">一次性模式或 daemon 常驻</text>
<rect x="620" y="275" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="620" y="275" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="638" y="307" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">ScheduledJobRunner</text>
<text x="638" y="338" font-size="19" fill="#516477" text-anchor="start">异步互斥、任务结果与批次状态</text>
<text x="638" y="364" font-size="19" fill="#516477" text-anchor="start">编排天气采集、分析及保存</text>
<rect x="1150" y="275" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="1150" y="275" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="1168" y="307" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">和风天气 QWeather</text>
<text x="1168" y="338" font-size="19" fill="#516477" text-anchor="start">逐小时预报 / 官方预警</text>
<text x="1168" y="364" font-size="19" fill="#516477" text-anchor="start">HTTPS；账户主机与权限需核对</text>
<rect x="70" y="560" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="70" y="560" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="88" y="592" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">统计 / 规则 / 报告</text>
<text x="88" y="623" font-size="19" fill="#516477" text-anchor="start">weather_stats / warning_rules</text>
<text x="88" y="649" font-size="19" fill="#516477" text-anchor="start">完整及整点报告生成器</text>
<rect x="620" y="560" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="620" y="560" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="638" y="592" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">WeatherService / Client</text>
<text x="638" y="623" font-size="19" fill="#516477" text-anchor="start">HTTPX 异步请求与响应归一化</text>
<text x="638" y="649" font-size="19" fill="#516477" text-anchor="start">限速、缓存、重试与缺失记录</text>
<rect x="70" y="765" width="370" height="140" fill="#f4f8fc" stroke="#255f91" stroke-width="1.6"/>
<rect x="70" y="765" width="5" height="140" fill="#255f91" stroke="#255f91" stroke-width="1.6"/>
<text x="88" y="797" font-size="24" fill="#255f91" text-anchor="start" font-weight="700">ArtifactStore / Publisher</text>
<text x="88" y="828" font-size="19" fill="#516477" text-anchor="start">保存 Markdown 和 JSON 审计</text>
<text x="88" y="854" font-size="19" fill="#516477" text-anchor="start">LocalOutboxPublisher 登记状态</text>
<polyline points="440,345 620,345" fill="none" stroke="#516477" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="448" y="309" width="115.83" height="25" fill="#fff" stroke="#fff" stroke-width="1.6"/>
<text x="455" y="325" font-size="17" fill="#516477" text-anchor="start">Python 调用</text>
<polyline points="805,415 805,560" fill="none" stroke="#516477" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="813" y="476" width="82" height="25" fill="#fff" stroke="#fff" stroke-width="1.6"/>
<text x="820" y="492" font-size="17" fill="#516477" text-anchor="start">采集编排</text>
<polyline points="990,630 1090,630 1090,345 1150,345" fill="none" stroke="#516477" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="1093" y="464" width="62.449999999999996" height="25" fill="#fff" stroke="#fff" stroke-width="1.6"/>
<text x="1100" y="480" font-size="17" fill="#516477" text-anchor="start">HTTPS</text>
<polyline points="620,630 440,630" fill="none" stroke="#516477" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="448" y="594" width="99" height="25" fill="#fff" stroke="#fff" stroke-width="1.6"/>
<text x="455" y="610" font-size="17" fill="#516477" text-anchor="start">归一化结果</text>
<polyline points="255,700 255,765" fill="none" stroke="#516477" stroke-width="2" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="263" y="729" width="145.07" height="25" fill="#fff" stroke="#fff" stroke-width="1.6"/>
<text x="270" y="745" font-size="17" fill="#516477" text-anchor="start">报告 / 审计保存</text>
<rect x="40" y="975" width="1560" height="235" fill="#f6f8fb" stroke="#cad5df" stroke-width="1.6"/>
<text x="60" y="1015" font-size="24" fill="#16324a" text-anchor="start" font-weight="700">持久化与实现边界</text>
<text x="60" y="1060" font-size="20" fill="#516477" text-anchor="start">部署边界：应用组件在同一 Python 进程；调度由 APScheduler 驱动，没有独立 Web 服务或数据库。</text>
<text x="60" y="1094" font-size="20" fill="#516477" text-anchor="start">本地依赖：Client → cache/；Runner → runtime/；ArtifactStore → reports/ + outbox/；日志 → logs/。</text>
<text x="60" y="1128" font-size="20" fill="#516477" text-anchor="start">daemon 锁约束常驻实例；Runner 的异步锁约束实例内任务，不能当作所有独立 CLI 的全局分布式锁。</text>
<text x="60" y="1162" font-size="20" fill="#516477" text-anchor="start">投递边界：Outbox 只保存 pending / preview / not_required / failed；仓库没有网络发送器。</text>
</g>
</svg>
