[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-analysis"
version = "0.1.0"
description = "示例区域机房极端天气预警报告生成工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[project.scripts]
weather-analysis = "weather_analysis.cli:run"

[tool.setuptools.package-data]
weather_analysis = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["weather_analysis*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
